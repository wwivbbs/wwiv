# Builds wwivbasic and runs the unit and golden tests.

name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-debug
          - os: windows-2022
            preset: windows-x64-debug
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # GitHub-hosted runners include vcpkg and a Java runtime (for the
      # ANTLR tool).
      # vcpkg.json pins builtin-baseline to a vcpkg commit, which may be newer
      # than the runner's copy, so fetch its history first.
      - name: Use the runner's vcpkg
        shell: bash
        run: |
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --quiet origin
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up Visual Studio x64 environment (Windows)
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
