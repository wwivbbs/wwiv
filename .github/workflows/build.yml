# Builds wwivbasic and runs the unit and golden tests.

name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-debug
          - os: windows-2022
            preset: windows-x64-debug
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      # vcpkg.json pins builtin-baseline to a vcpkg commit, and vcpkg reads its
      # version database from the checked-out files, so use a clone of exactly
      # that commit rather than the runner's preinstalled vcpkg.
      - name: Check out the pinned vcpkg
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)
          echo "vcpkg baseline: $baseline"
          vcpkg_root="$RUNNER_TEMP/vcpkg"
          git init --quiet "$vcpkg_root"
          cd "$vcpkg_root"
          git fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git "$baseline"
          git checkout --quiet FETCH_HEAD
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c bootstrap-vcpkg.bat -disableMetrics
          else
            ./bootstrap-vcpkg.sh -disableMetrics
          fi
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"

      # The ANTLR tool needs Java 11 or newer; the Windows runner defaults to
      # Java 8.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up Visual Studio x64 environment (Windows)
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
