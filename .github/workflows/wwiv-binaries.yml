# GitHub lists every branch's runs of this file under main's `name:`, so it
# has no version in it. Each run's title (`run-name:`) has the version.
name: WWIV Binaries
run-name: WWIV 5.10 CI

# ** IMPORTANT: ONLY allow on push events here since WWIV
# has some self hosted runners

on:
  push:
    branches: 
      - main

# Jobs get only the permissions they need (see each job).
permissions: {}

env:
    CMAKE_BIN: cmake
    CTEST_BIN: ctest
    CPACK_BIN: cpack
    WORKSPACE: ${{ github.workspace }}
    # The release version and the prefix for build tags (e.g. wwiv5.10_3779).
    # Update both when starting a new release.
    WWIV_RELEASE: 5.10.0
    WWIV_RELEASE_LABEL: wwiv5.10
    # TODO - rushfan - we should probably remove this.
    BUILD_NUMBER: 8675309

jobs:
  wwiv-build-number:
    name: Create Build Number
    if: github.repository_owner == 'wwivbbs'
    runs-on: ubuntu-latest
    permissions:
      # build-tag-number stores the counter in a ref; the build tag is created here too.
      contents: write
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
      wwiv_release: ${{ env.WWIV_RELEASE }}
      wwiv_tag: ${{ steps.generate_tag.outputs.wwiv_tag }}
    steps:
      - name: Checkout, Tag and Build Number
        id: buildnumber
        uses: onyxmueller/build-tag-number@eab99bb956086490d1aa6b747dc265b5776e8eae # v1.1.0
        with:
          token: ${{secrets.github_token}}  
          
      - name: Generate Tag Name
        id: generate_tag
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.buildnumber.outputs.build_number }}
        run: |
          echo "wwiv_tag=${WWIV_RELEASE_LABEL}_${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      # Create the annotated build tag with the API, so this job needs no
      # checkout (and no git credentials on disk).
      - name: Tag the commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WWIV_TAG: ${{ steps.generate_tag.outputs.wwiv_tag }}
        run: |
          echo "WWIV_TAG: ${WWIV_TAG}"
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${WWIV_TAG}" -f message="${WWIV_TAG} SHA: ${GITHUB_SHA}" \
            -f object="${GITHUB_SHA}" -f type=commit \
            -f "tagger[name]=GitHub Action" -f "tagger[email]=gh-action@wwivbbs.org" \
            --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${WWIV_TAG}" -f sha="${tag_sha}" > /dev/null

  wwiv-release:
    name: Build and Publish
    needs:
      - wwiv-build-number
    strategy:
        matrix:
          os:
            - windows-2022
            - ubuntu-26.04
          include:
            # GitHub hosted runner (WWIV requires GCC 14 or newer)
            - os: ubuntu-26.04
              lib_suffix: so
              wwiv_distro: linux-ubuntu2604
              archive_suffix: tar.gz
              compiler_cache: ccache
            # GitHub hosted runner
            - os: windows-2022
              lib_suffix: dll
              wwiv_distro: win-x86
              archive_suffix: zip
              compiler_cache: sccache
        fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      BUILD_NUMBER: ${{needs.wwiv-build-number.outputs.build_number}}
      WWIV_TAG: ${{needs.wwiv-build-number.outputs.wwiv_tag}}
      WWIV_DISTRO: ${{ matrix.wwiv_distro }}
      WWIV_RELEASE_ARCHIVE_FILE: wwiv-${{ matrix.wwiv_distro }}-${{ needs.wwiv-build-number.outputs.wwiv_release }}.${{needs.wwiv-build-number.outputs.build_number}}.${{ matrix.archive_suffix }}
      CMAKE_BINARY_DIR: '${{ github.workspace }}/_build'
      WWIV_RELEASE_DIR: '${{ github.workspace }}/_build/release'
      
    steps:

      # - name: Dump Vars
      #   env:
      #     VARS: ${{ toJson(vars) }}
      #     EVENT: ${{ toJson(github.event) }}
      #     REPO: ${{ github.repository }}
      #     RELEASE: ${{ vars.WWIV_RELEASE }}
      #   shell: bash
      #   run: |
      #     echo "WWIV_RELEASE_ARCHIVE_FILE: ${{ env.WWIV_RELEASE_ARCHIVE_FILE }}"
      #     echo "release: ${{ env.RELEASE }}"
      #     echo "github.repository_owner: ${{ github.repository_owner }}"
      #     echo "github.repo: ${{ env.REPO }}"
      #     echo "github.event context: ${{ env.EVENT }}"
      #     echo "vars context: ${{ env.VARS }}"

      # Check it out again since now it's a new job.
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          
      # vcpkg.json pins builtin-baseline to an older vcpkg commit than the
      # submodule's, and checkout clones submodules shallow. vcpkg only needs
      # that one commit (not the whole history), so fetch just it.
      # Self-hosted runners keep their workspace, so it may already be there.
      - name: Fetch vcpkg baseline commit
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)
          if [ -z "${baseline}" ]; then
            echo '::error::Could not read builtin-baseline from vcpkg.json (expected "builtin-baseline": "<sha>" on one line)'
            exit 1
          fi
          if ! git -C vcpkg cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            git -C vcpkg fetch --depth=1 origin "${baseline}"
          fi

      - name: Get CMake
        uses: lukka/get-cmake@a1a8216777d3cbbf5602c73b9ddd3e98257ecdc4 # v4.5.1

      - name: Install packages (Linux)
        if: ${{ matrix.os != 'windows-2022' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev zlib1g-dev pkg-config zip mold

      - name: Setup a new vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6

      - name: Locate Visual Studio (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          $vcbase=$(vswhere -legacy -latest -property installationPath)
          echo VCVARS_ALL="${vcbase}\VC\Auxiliary\Build\vcvarsall.bat" >> "$env:GITHUB_ENV"

      - name: Set up Visual Studio Env (Windows)
        uses: egor-tensin/vs-shell@3b829f5acc8082151a836f5a3a179f69336ae1f2 # v2.3.0
        if: ${{ matrix.os == 'windows-2022' }}
        with:
          arch: x86

      # Release builds have their own compiler cache, separate from PR Build's
      # (different key, "release-<distro>"). This workflow only runs on pushes
      # to main and release branches, and GitHub only lets a run write caches
      # in its own branch's scope, so only merged code writes this cache; pull
      # requests can't. ccache/sccache key entries on the compiler, flags and
      # preprocessed source, so a hit is the same object a cold build makes.
      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26 # zizmor: ignore[cache-poisoning]
        with:
          variant: ${{ matrix.compiler_cache }}
          key: release-${{ matrix.wwiv_distro }}
          max-size: 1G
          # Keep only what this build used, so the saved cache stays small.
          evict-old-files: job

      - name: Build (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        # build.cmd checks errors itself (it is also the Jenkins script), so
        # cmd's lack of fail-on-error doesn't matter here.
        shell: cmd # zizmor: ignore[misfeature]
        run: builds\jenkins\wwiv\build.cmd
        env:
          WWIV_ARCH: x86
          WWIV_USE_COMPILER_CACHE: "ON"
          # vcpkg default local binary cache. Self-hosted runners keep it
          # between runs, so dependencies are not rebuilt every time; on
          # GitHub-hosted runners it starts empty. Only pushes to main run here.
          VCPKG_BINARY_SOURCES: clear;default,readwrite

      - name: Build (Linux)
        if: ${{ matrix.os != 'windows-2022' }}
        shell: bash
        run: builds/jenkins/wwiv/build
        env:
          WWIV_ARCH: x86
          WWIV_USE_COMPILER_CACHE: "ON"
          # vcpkg default local binary cache. Self-hosted runners keep it
          # between runs, so dependencies are not rebuilt every time; on
          # GitHub-hosted runners it starts empty. Only pushes to main run here.
          VCPKG_BINARY_SOURCES: clear;default,readwrite

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          
      - name: Look for output file
        shell: bash
        run: ls "${WWIV_RELEASE_ARCHIVE_FILE}"
  
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.WWIV_RELEASE_ARCHIVE_FILE }}
          path: ${{ env.WWIV_RELEASE_ARCHIVE_FILE }}

  # Creates the GitHub release once the builds are done, with every archive
  # that was built. Creating it at the end (instead of before the builds)
  # means nobody sees an empty or half-uploaded release. If one build fails,
  # the release still goes out with the other platform's archive; if every
  # build fails, no release is created (the build tag is still pushed).
  publish-release:
    name: Publish Release
    needs:
      - wwiv-build-number
      - wwiv-release
    if: ${{ !cancelled() && needs.wwiv-build-number.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WWIV_TAG: ${{ needs.wwiv-build-number.outputs.wwiv_tag }}
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wwiv-*
          path: archives
          merge-multiple: true

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(archives/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No build succeeded, so release ${WWIV_TAG} was not created."
            exit 1
          fi
          ls -l archives
          gh release create "${WWIV_TAG}" "${files[@]}" \
            --title "${WWIV_TAG}" --prerelease --verify-tag --notes ""