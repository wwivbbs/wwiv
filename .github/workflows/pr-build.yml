# WWIV pull request build.
#
# Builds and runs the tests for pull requests using the same CMake presets
# described in README.md. This only uses GitHub-hosted runners (never the
# self-hosted ones), and it never tags, releases or publishes anything.
#
# It also runs on pushes to main, to fill the build caches (compiler cache and
# vcpkg packages) that pull requests restore from.
#
# Cache safety: only runs for pushes to main save caches. Pull request runs
# restore them but never save, so a pull request can't change what any other
# build gets from the cache. (GitHub also scopes anything a pull request saves
# to that pull request.) Never add a pull_request_target trigger here.

name: PR Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and Test (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            preset: linux-debug
            compiler_cache: ccache
          - os: windows-2022
            preset: windows-x86-debug
            compiler_cache: sccache
    runs-on: ${{ matrix.os }}
    env:
      # Only pushes to main save caches; see "Cache safety" above.
      SAVE_CACHES: ${{ github.event_name == 'push' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # vcpkg.json pins builtin-baseline to an older vcpkg commit than the
      # submodule's, and checkout clones submodules shallow. vcpkg only needs
      # that one commit (not the whole history), so fetch just it.
      - name: Fetch vcpkg baseline commit
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)
          if [ -z "${baseline}" ]; then
            echo '::error::Could not read builtin-baseline from vcpkg.json (expected "builtin-baseline": "<sha>" on one line)'
            exit 1
          fi
          if ! git -C vcpkg cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            git -C vcpkg fetch --depth=1 origin "${baseline}"
          fi

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@a1a8216777d3cbbf5602c73b9ddd3e98257ecdc4 # v4.5.1

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev zlib1g-dev pkg-config zip lld

      - name: Set up Visual Studio x86 environment (Windows)
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@3b829f5acc8082151a836f5a3a179f69336ae1f2 # v2.3.0
        with:
          arch: x86

      # Installs ccache (Linux) or sccache (Windows) and restores its cache.
      # CMake picks it up automatically (see cmake/BuildSpeed.cmake).
      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
        with:
          variant: ${{ matrix.compiler_cache }}
          key: ${{ matrix.preset }}
          max-size: 1G
          save: ${{ env.SAVE_CACHES }}
          # Keep only what this build used, so the saved cache stays small.
          evict-old-files: job

      # vcpkg's own binary cache, so the dependencies (fmt, gtest, ...) are not
      # rebuilt every time. vcpkg keys packages by an ABI hash, so a stale
      # cache only means a miss, never a wrong package.
      - name: Set up vcpkg binary cache
        id: vcpkg-cache
        shell: bash
        run: |
          dir="${RUNNER_TEMP//\\//}/vcpkg-bincache"
          mkdir -p "${dir}"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          echo "VCPKG_BINARY_SOURCES=clear;files,${dir},readwrite" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache.outputs.dir }}
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ matrix.preset }}-

      - name: List cached vcpkg packages
        id: vcpkg-before
        shell: bash
        env:
          VCPKG_CACHE_DIR: ${{ steps.vcpkg-cache.outputs.dir }}
        run: |
          cd "${VCPKG_CACHE_DIR}"
          echo "count=$(find . -type f | wc -l)" >> "$GITHUB_OUTPUT"
          echo "hash=$(find . -type f | sort | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"

      # Also builds wwivbasic (the new BASIC interpreter) and its tests. With
      # WWIVBASIC_GENERATE_PARSER=OFF, configure fails if wwivbasic's grammar
      # changed without the regenerated parser being committed.
      - name: Configure
        id: configure
        run: cmake --preset ${{ matrix.preset }} -DWWIV_WWIVBASIC_NEXT=ON -DWWIVBASIC_GENERATE_PARSER=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # On main, drop cached packages this build didn't use (so the entry
      # doesn't keep growing toward the repository's cache limit and push out
      # the compiler cache), then save a new entry only if anything changed.
      # The files provider stores each package as <abi[0:2]>/<abi>.zip, and
      # vcpkg's status file lists the ABI hash of every installed package.
      # Runs even if the build or tests failed, but only once configure (which
      # runs vcpkg install) succeeded, so the package list is complete.
      - name: Prune and check vcpkg binary cache
        id: vcpkg-after
        if: >-
          always() && env.SAVE_CACHES == 'true'
          && steps.vcpkg-before.outcome == 'success'
          && steps.configure.outcome == 'success'
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          VCPKG_CACHE_DIR: ${{ steps.vcpkg-cache.outputs.dir }}
          BEFORE_COUNT: ${{ steps.vcpkg-before.outputs.count }}
          BEFORE_HASH: ${{ steps.vcpkg-before.outputs.hash }}
        run: |
          status="_build/${PRESET}/vcpkg_installed/vcpkg/status"
          used=$(sed -n 's/^Abi: *\([0-9a-f]*\).*/\1/p' "${status}" | sort -u)
          if [ -z "${used}" ]; then
            echo "::error::No package ABI hashes in ${status}; not touching the cache"
            exit 1
          fi
          cd "${VCPKG_CACHE_DIR}"
          pruned=0
          while IFS= read -r f; do
            abi=$(basename "${f}" .zip)
            if ! grep -qxF "${abi}" <<< "${used}"; then
              rm -f "${f}"
              pruned=$((pruned + 1))
            fi
          done < <(find . -type f)
          find . -type d -empty -delete
          count=$(find . -type f | wc -l)
          hash=$(find . -type f | sort | sha256sum | cut -c1-64)
          echo "Cached vcpkg packages: ${BEFORE_COUNT} before, ${pruned} unused pruned, ${count} after"
          if [ "${hash}" != "${BEFORE_HASH}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-after.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache.outputs.dir }}
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
