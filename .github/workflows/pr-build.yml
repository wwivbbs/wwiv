# WWIV pull request build.
#
# Builds and runs the tests for pull requests using the same CMake presets
# described in README.md. This only uses GitHub-hosted runners (never the
# self-hosted ones), and it never tags, releases or publishes anything.

name: PR Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: linux-debug
          - os: windows-2022
            preset: windows-x86-debug
    runs-on: ${{ matrix.os }}
    env:
      # Matches the main CI build; the x-gha binary cache is broken.
      VCPKG_BINARY_SOURCES: clear
      # These tests fail on main today (the main CI build ignores test
      # failures). Excluded so PRs are judged on new failures only; remove
      # each one once it is fixed.
      #  - BasicTest.Smoke_Fail: expects no output, but script errors are
      #    now echoed.
      #  - DateTime.MinusOne: from_time_t(-1) is clamped to t=1, which is
      #    1969-12-31 only west of UTC; the runners are on UTC.
      CTEST_EXCLUDE: '^(BasicTest\.Smoke_Fail|DateTime\.MinusOne)$'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # vcpkg.json pins builtin-baseline to an older vcpkg commit, which needs
      # the vcpkg submodule's history; checkout clones submodules shallow.
      - name: Unshallow vcpkg submodule
        run: git -C vcpkg fetch --unshallow

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev zlib1g-dev pkg-config zip

      - name: Set up Visual Studio x86 environment (Windows)
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x86

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The tests need cryptlib's DLL on Windows; the build doesn't copy it yet.
      - name: Copy cl32.dll (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp install/platform/win32/cl32.dll _build/${{ matrix.preset }}/

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --exclude-regex '${{ env.CTEST_EXCLUDE }}'
